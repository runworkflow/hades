[package]
name = "hades-core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
data-encoding = "2.11.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
zeroize = { version = "1.9.2", features = ["derive"] }
