[package]
name = "hades-app"
version = "0.1.0"
description = "Hades secret manager"
edition = "2024"

[lib]
name = "hades_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
