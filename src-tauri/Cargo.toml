[package]
name = "hades-app"
version = "0.1.0"
description = "Hades secret manager"
edition = "2024"

[lib]
name = "hades_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
hades-core = { path = "../crates/hades-core" }
serde = { version = "1", features = ["derive"] }
zeroize = "1"
arboard = { version = "3.7.0", default-features = false }
